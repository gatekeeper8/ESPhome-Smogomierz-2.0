name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly: catch breaking changes in new ESPHome releases
  workflow_dispatch:

jobs:
  esphome:
    name: ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - run: cp secrets.yaml.example secrets.yaml
      - run: esphome config smogomierz.yaml
